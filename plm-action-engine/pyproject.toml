[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plm-action-engine"
version = "0.6.0a1"
description = "Governed enterprise action planning, approval, execution, verification, and audit service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "httpx>=0.27,<1.0",
  "python-dotenv>=1.0,<2.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
