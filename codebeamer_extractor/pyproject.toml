[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codebeamer-extractor"
version = "0.1.0"
description = "Dynamic Codebeamer requirement discovery, synchronization, and search"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "respx>=0.21,<1"]

[project.scripts]
codebeamer-extractor = "codebeamer_extractor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/codebeamer_extractor"]
